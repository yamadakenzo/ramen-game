<!-- index.html 自体のブラウザキャッシュ対策。GitHub PagesのCDN(Fastly)にはヘッダーを上書きする
     手段が無いので効かないが(実体はCDN側のCache-Control: max-age=600で、リポジトリ側から制御不可)、
